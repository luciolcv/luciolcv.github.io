bio:
  - "He is an Assistant Professor (RTD-A) at the DIMES Department of the University of Calabria, Italy."
  - "Previously, he earned a Ph.D. cum laude in ICT at DIMES with a thesis on Graph Mining and Multimodal Representation Learning for Decentralized Socio-Economic Domains."
  - "He was a visiting researcher at the IT University of Copenhagen, and is a member of the ML, NLP and Network Science team at the AI & Data Science Lab @DIMES."
research:
  - title: "Machine-generated text detection"
    description: "Stylometric, statistical, and representation-level forensics for synthetic text in the wild."
    icon: "fingerprint"
  - title: "LLM interpretability"
    description: "Probing residual streams to surface concepts, intent, and the geometry of model thought."
    icon: "aperture"
  - title: "Representation engineering"
    description: "Steering vectors and contrastive directions as a control surface for behaviour."
